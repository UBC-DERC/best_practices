name: core_actions
on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
              with:
                enable-cache: true
                python-version: ${{ matrix.python-version }}
            - run: uv sync
            - name: Lint (ruff)
              run: uv run ruff check .
            - name: Lint formatting (ruff)
              run: uv run ruff format --check .
            - name: Type check (ty)
              run: uv run ty check
            - name: Test package load with coverage
              run: uv run pytest --cov=.
    badge:
      runs-on: ubuntu-latest
      needs: build
      if: github.ref == 'refs/heads/main'
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        - name: best-practices (self-test)
          uses: ./
          with:
            badge: best-practices-badge.json
            output: best-practices-report.md
        - uses: stefanzweifel/git-auto-commit-action@92648143fd6aebb695590bfe3fc28f92bcf383e4
          with:
            commit_message: "chore: update best-practices badge [skip ci]"
            file_pattern: best-practices-badge.json
