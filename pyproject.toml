[project]
name = "derc-best-practices"
version = "26.10"
description = "Monitoring project best practices with a Python observer."
readme = "README.md"
authors = [
    { name = "Simon Goring", email = "simon.goring@ubc.ca" }
]

license = "MIT"
license-files = ["LICENSE.md"]

requires-python = ">=3.11"

dependencies = [
    "gitpython>=3.2.1",
    "pydantic>=2.14.0",
]

keywords = ["research software", "best practices", "reproducibility", "github action", "UBC", "DERC"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/<org>/best_practices"
Repository = "https://github.com/<org>/best_practices"
Issues = "https://github.com/<org>/best_practices/issues"
Changelog = "https://github.com/<org>/best_practices/blob/main/CHANGELOG.md"
Funding = "https://github.com/<org>/best_practices#funding"

[project.scripts]
derc-best-practices = "best_practices.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.87",
    "pre-commit>=4.7.0",
]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[tool.ruff]
exclude = [
    "data",
    "assets",
    "docs"
  ]

[tool.ruff.lint]
extend-select = ["D", "I", "UP", "B", "PT"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
testpaths = [
    "tests"
  ]
addopts = ["--maxfail=5", "-rf"]
console_output_style = "progress"
strict_markers = true

[tool.coverage.run]
branch = true
source = ["best_practices"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
fail_under = 70
format = "markdown"
skip_empty = true

[tool.uv.build-backend]
module-name = "best_practices"
